<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
<title id="title">OnePiece algorithm plugin architecture</title>
<desc id="desc">The Qt host uses a loader and runner to execute three native algorithm plugins through a shared contract.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8fa4b9" stroke-width="1.5"/></marker>
</defs>
<rect width="1080" height="540" rx="18" fill="#111b28"/>
<g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">
<text x="40" y="45" fill="#6bc8e8" font-size="14" letter-spacing="2">ONEPIECE / ARCHITECTURE</text>
<text x="40" y="82" fill="#f2f6fb" font-size="28" font-weight="700">From algorithms to desktop tools</text>
<rect x="40" y="132" width="280" height="136" rx="10" fill="#1a3446" stroke="#3a7187"/>
<text x="60" y="170" fill="#f2f6fb" font-size="22" font-weight="600">Qt Widgets host</text>
<text x="60" y="204" fill="#bdcddd" font-size="17">Image input · Parameter forms</text>
<text x="60" y="234" fill="#bdcddd" font-size="17">Result preview · Logs</text>
