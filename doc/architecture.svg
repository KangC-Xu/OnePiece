<text x="400" y="204" fill="#bdcddd" font-size="17">Discover DLLs · Read metadata</text>
<text x="400" y="234" fill="#bdcddd" font-size="17">Factory → Initialize → Run</text>
<path d="M320 200 H370 M670 200 H704 V166 H730 M704 200 V282 H730 M704 282 V398 H730" fill="none" stroke="#8fa4b9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="740" y="118" width="300" height="96" rx="10" fill="#1b3939" stroke="#35726c"/>
<text x="760" y="153" fill="#f2f6fb" font-size="21" font-weight="600">Traditional vision</text>
<text x="760" y="185" fill="#bdcddd" font-size="16">OpenCV · Threshold · Edges</text>
